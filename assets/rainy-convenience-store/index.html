/* returns false when the element has no usable layout yet */
function resize() {
  var w = canvas.clientWidth || window.innerWidth || 0;
  var h = canvas.clientHeight || window.innerHeight || 0;
  if (w < 8 || h < 8) return false;
  _lastW = w; _lastH = h;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  VW = Math.round(w * dpr); VH = Math.round(h * dpr);
  var ss = SS;
  var MAXPX = 4.2e6;
  while (VW * ss * VH * ss > MAXPX && ss > 1.0) ss -= 0.05;
  RW = Math.max(2, Math.round(VW * ss)); RH = Math.max(2, Math.round(VH * ss));

  renderer.setSize(VW, VH, false);
  var asp = w / h;
  camera.aspect = asp;
  camera.fov = asp >= 1.0 ? 30 : lerp(44, 30, clamp((asp - 0.45) / 0.55, 0, 1));
  camera.updateProjectionMatrix();

  /* frame the whole plinth whatever the viewport shape */
  var vt = Math.tan(camera.fov * D2R * 0.5), ht = vt * asp;
  var fit = clamp(Math.max(12.2 / ht, 7.9 / vt), 18, 104);

    var kf = fit / _lastFit;

    Ctl.sph.radius = clamp(Ctl.sph.radius * kf, Ctl.minR, Ctl.maxR);
  }
  _lastFit = fit;

  if (rtColor) { rtColor.dispose(); rtNormal.dispose(); rtBloomA.dispose(); rtBloomB.dispose(); }
  var msaa = renderer.capabilities.isWebGL2 ? 4 : 0;
  rtColor = makeRT(RW, RH, msaa);
  rtNormal = makeRT(RW, RH, 0);
  var bw = Math.max(2, RW >> 1), bh = Math.max(2, RH >> 1);
  rtBloomA = makeRT(bw, bh, 0); rtBloomA.depthBuffer = false;
  rtBloomB = makeRT(bw, bh, 0); rtBloomB.depthBuffer = false;

  compMat.uniforms.uTexel.value.set(1 / RW, 1 / RH);
  compMat.uniforms.uAsp.value = w / h;

}
window.addEventListener('resize', resize);

var _clearBlack = new T.Color(0x000000);
function renderFrame() {
  var dist = camera.position.distanceTo(Ctl.target);
  ND_UNI.uNear.value = Math.max(0.4, dist - 25);
  ND_UNI.uFar.value = dist + 34;

  /* 1. backdrop (also clears colour+depth of rtColor) */
  renderer.autoClear = true;
  blit(bgMat, rtColor);

  /* 2. beauty pass */
  renderer.autoClear = false;
  renderer.setRenderTarget(rtColor);
  renderer.render(scene, camera);
  renderer.autoClear = true;

  /* 3. normal/depth G-buffer */
  var i, n = NO_OUTLINE.length;
  for (i = 0; i < n; i++) { NO_OUTLINE[i].userData._vis = NO_OUTLINE[i].visible; NO_OUTLINE[i].visible = false; }
  ndSwapOn();
  renderer.shadowMap.autoUpdate = false;
  renderer.setClearColor(0x808080, 1);
  renderer.setRenderTarget(rtNormal);
  renderer.clear();
  renderer.render(scene, camera);
  ndSwapOff();
  renderer.shadowMap.autoUpdate = true;
  renderer.setClearColor(_clearBlack, 0);
  for (i = 0; i < n; i++) NO_OUTLINE[i].visible = NO_OUTLINE[i].userData._vis;

  /* 4. bloom */
  brightMat.uniforms.tDiffuse.value = rtColor.texture;
  blit(brightMat, rtBloomA);
  var bw = rtBloomA.width, bh = rtBloomA.height;

  blurMat.uniforms.uDir.value.set(1.15 / bw, 0); blit(blurMat, rtBloomB);
  blurMat.uniforms.tDiffuse.value = rtBloomB.texture;
  blurMat.uniforms.uDir.value.set(0, 1.15 / bh); blit(blurMat, rtBloomA);
  blurMat.uniforms.tDiffuse.value = rtBloomA.texture;
  blurMat.uniforms.uDir.value.set(3.1 / bw, 0); blit(blurMat, rtBloomB);
  blurMat.uniforms.tDiffuse.value = rtBloomB.texture;
  blurMat.uniforms.uDir.value.set(0, 3.1 / bh); blit(blurMat, rtBloomA);

  compMat.uniforms.tColor.value = rtColor.texture;
  compMat.uniforms.tNormal.value = rtNormal.texture;
  compMat.uniforms.tBloom.value = rtBloomA.texture;

}
/* ============================================================================
   WET SURFACE SHADER
   Every horizontal surface in the diorama is rain-slicked.  Rather than fake
   the look with painted decals -- which break the moment the model is rotated

   the view ray is reflected about a ripple-perturbed up-normal and tested

var WET_NL = 12;                 // must match the array size in the shader

  uLP: { value: [] },            // vec4( worldPos, radius )
  uLC: { value: [] },            // vec4( colour * intensity, groundPoolStrength )

  uRainAmt: { value: 1.0 }

(function () {
  for (var i = 0; i < WET_NL; i++) {

    WET_UNI.uLC.value.push(new T.Vector4(0, 0, 0, 0));

/** register a reflected light source; returns its index for live updates */

  var L = {
    p: new T.Vector3(x, y, z), c: new T.Color(color),
    r: radius, k: intensity, pool: pool === undefined ? 0.0 : pool,
    idx: WET_LIGHTS.length

  p.set(L.p.x, L.p.y, L.p.z, L.r);

  var sheen = new T.Color(o.sheen !== undefined ? o.sheen : 0x9dc6ff);
  var rimS = o.rim !== undefined ? o.rim : 0.06;
  var key = 'wet' + (o.ramp || 2);
  m.onBeforeCompile = function (sh) {
    sh.uniforms.uLP = WET_UNI.uLP;
    sh.uniforms.uLC = WET_UNI.uLC;
    sh.uniforms.uCamP = WET_UNI.uCamP;
    sh.uniforms.uRainAmt = WET_UNI.uRainAmt;
    sh.uniforms.uTime = TIME_UNI;
    sh.uniforms.uWet = { value: wet };
    sh.uniforms.uRip = { value: rip };
    sh.uniforms.uGloss = { value: gloss };
    sh.uniforms.uPoolK = { value: pool };
    sh.uniforms.uSheen = { value: sheen };
    sh.uniforms.uRimS2 = { value: rimS };

      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>', WET_VERT_INJECT);

      .replace('#include <common>', '#include <common>\n' + WET_COMMON + '\nuniform float uRimS2;')
      .replace('#include <lights_fragment_end>', WET_FRAG_INJECT +
        '\n{ float rf = 1.0 - saturate( dot( normalize( vViewPosition ), normal ) );\n' +
        '  rf = smoothstep( 0.62, 1.0, rf );\n' +

/* ============================================================================
   PUDDLE SHAPES -- crisp irregular outlines, the way ink-lined animation
   draws standing water
   ========================================================================== */
function blobShape(rad, lobes, wob, rngf) {
  var s = new T.Shape();
  var n = 26, i, pts = [];
  var seedA = rngf() * TAU, seedB = rngf() * TAU, seedC = rngf() * TAU;
  for (i = 0; i < n; i++) {
    var a = i / n * TAU;
    var r = rad * (1 + Math.sin(a * lobes + seedA) * wob
      + Math.sin(a * (lobes * 2 + 1) + seedB) * wob * 0.45
      + Math.sin(a * (lobes * 3 + 2) + seedC) * wob * 0.22);
    pts.push(new T.Vector2(Math.cos(a) * r, Math.sin(a) * r));
  }
  s.moveTo(pts[0].x, pts[0].y);
  for (i = 1; i <= n; i++) {
    var p0 = pts[(i - 1) % n], p1 = pts[i % n], p2 = pts[(i + 1) % n];
    var cx = p1.x, cy = p1.y;
    var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    s.quadraticCurveTo(cx, cy, mx, my);
  }
  s.closePath();
  return s;
}
function puddleMesh(rad, lobes, wob, mat, x, y, z, rngf) {
  var g = new T.ShapeGeometry(blobShape(rad, lobes, wob, rngf || RNG), 8);
  g.rotateX(-PI / 2);
  var m = new T.Mesh(g, mat);
  m.position.set(x, y, z);
  m.castShadow = false; m.receiveShadow = true;
  return m;
}

/* ============================================================================

   ========================================================================== */
(function buildMarkings() {
  var g = new T.Group();

    m.castShadow = false;

  }

  for (var x = -HALF + 0.4; x < HALF - 0.4; x += 2.10) {

  line(RDB_X1 - 0.53, RDB_X1 - 0.42, -HALF, RDA_Z0);

  /* zebra crossing over road B, right at the corner */
  var zz0 = 1.35, zz1 = 2.95;
  for (var i = 0; i < 6; i++) {
    var sx = RDB_X0 + 0.30 + i * 0.78;
    line(sx, sx + 0.46, zz0, zz1, M.paintZeb);
  }
  /* stop bar + give-way triangles ahead of the crossing */
  line(RDB_X0 + 0.20, cx - 0.10, 3.24, 3.48);
  for (var k = 0; k < 4; k++) {
    var tx = RDB_X0 + 0.36 + k * 0.60;
    var tri = new T.Shape();
    tri.moveTo(-0.19, 0); tri.lineTo(0.19, 0); tri.lineTo(0, 0.52); tri.closePath();
    var tg = new T.ShapeGeometry(tri);
    tg.rotateX(-PI / 2);

  /* parking bays in front of the shop */

  for (var b = 0; b < 3; b++) {
    var x0 = bx + b * 2.55;
    line(x0, x0 + 0.10, PARK_Z0 + 0.28, PARK_Z1 - 0.16);
    line(x0 + 2.45, x0 + 2.55, PARK_Z0 + 0.28, PARK_Z1 - 0.16);
    line(x0, x0 + 2.55, PARK_Z1 - 0.26, PARK_Z1 - 0.16);

  for (var h = 0; h < 5; h++) {

  var ar = new T.Shape();

  var ag = new T.ShapeGeometry(ar);
  ag.rotateX(-PI / 2);

  am.position.set(-2.6, 0.012, RDA_Z0 + 1.15);
  am.rotation.y = -PI / 2;
  am.castShadow = false; am.receiveShadow = true;
  g.add(am);
  var am2 = am.clone();
  am2.position.set(7.6, 0.012, RDA_Z1 - 1.15);
  am2.rotation.y = PI / 2;
  g.add(am2);

  for (var q = 0; q < g.children.length; q++) NO_OUTLINE.push(g.children[q]);

(function buildCovers() {
  function manhole(x, z, r) {
    var g = new T.Group();
    g.position.set(x, 0.010, z);
    var body = mesh(cylG(r, r, 0.02, 24), toon(C.manhole, { rim: 0.16, ramp: 2 }), 0, 0, 0);
    body.castShadow = false;
    g.add(body);
    var ring = new T.Mesh(new T.RingGeometry(r * 0.62, r * 0.72, 24), toon(0x5c5a68, { rim: 0.14, ramp: 2 }));
    ring.rotateX(-PI / 2); ring.position.y = 0.014;
    g.add(ring);
    for (var i = 0; i < 8; i++) {
      var a = i / 8 * TAU;
      var sp = box(r * 0.42, 0.014, 0.05, toon(0x5c5a68, { rim: 0.14, ramp: 2 }),
        Math.cos(a) * r * 0.36, 0.014, Math.sin(a) * r * 0.36);
      sp.rotation.y = -a;
      g.add(sp);
    }
    g.traverse(function (o) { if (o.isMesh) { o.castShadow = false; NO_OUTLINE.push(o); } });
    groundGrp.add(g);
  }
  manhole(-2.60, 7.30, 0.42);
  manhole(6.60, -3.10, 0.40);
  manhole(6.80, 7.40, 0.44);
  /* small square valve covers */
  /* y is explicit: a cover dropped at grade 0 on a raised pavement is simply
     buried inside the slab. */
  function valve(x, z, s, y) {
    var m = box(s, 0.02, s, toon(0x555362, { rim: 0.14, ramp: 2 }), x, (y || 0) + 0.010, z);
    m.castShadow = false;
    groundGrp.add(m); NO_OUTLINE.push(m);
  }
  valve(-3.9, 3.55, 0.34, CURB_Y); valve(3.42, -2.20, 0.30, CURB_Y); valve(9.30, 2.10, 0.32, CURB_Y);
})();

/* ============================================================================

   Puddles are ordinary flat polygons with hard ink outlines -- the mirror

   ========================================================================== */
var PUDDLES = [];
(function buildPuddles() {
  RNG = mulberry32(90210);
  function pud(x, z, r, y, mat) {
    var m = puddleMesh(r, ri(3, 4), 0.125, mat || M.puddle, x, y === undefined ? 0.016 : y, z, RNG);

function glassPane(w, h, x, y, z, ry, mat) {
  var m = plane(w, h, mat || MS.glass, x, y, z);
  m.rotation.y = ry || 0;

  m.renderOrder = 5;
  m.castShadow = false; m.receiveShadow = false;

/* ============================================================================

(function shell() {

  g.add(bbox(X0 - WALL_T, X1 + WALL_T, -0.05, FLOOR_Y, Z0 - WALL_T, Z1 + 0.02, MS.kick));
  /* +4 mm: the kick slab already tops out exactly at FLOOR_Y */

  flr.receiveShadow = true;

  g.add(bbox(X1 - 0.02, X1 + 0.08, 0, GL_BOT, -4.50, Z1, MS.kick));                    // east sill
  g.add(bbox(X0, X1 + WALL_T, GL_TOP, WALL_TOP, Z1 - 0.10, Z1 + 0.02, MS.wall));       // front header

/* ============================================================================
   GLAZING
   ========================================================================== */
(function glazing() {
  var g = new T.Group(); storeGrp.add(g);
  var MW = 0.075;                                  // mullion width
  var gy = (GL_BOT + GL_TOP) / 2, gh = GL_TOP - GL_BOT;

  /* --- front elevation --- */
  var fx0 = ST_X0 + 0.02, fx1 = ST_X1 - 0.02;
  var dz = ST_Z1 - 0.035;
  var jamb0 = DOOR_CX - DOOR_HW - 0.06, jamb1 = DOOR_CX + DOOR_HW + 0.06;
  var mulX = [fx0, -4.62, -3.24, jamb0, jamb1, 0.52, fx1];
  var i;
  for (i = 0; i < mulX.length; i++) {
    g.add(bbox(mulX[i] - MW / 2, mulX[i] + MW / 2, GL_BOT - 0.02, GL_TOP + 0.06, ST_Z1 - 0.10, ST_Z1 + 0.02, MS.mull));
  }
  /* head + sill rails */
  g.add(bbox(fx0 - MW, fx1 + MW, GL_TOP, GL_TOP + 0.075, ST_Z1 - 0.10, ST_Z1 + 0.02, MS.mullD));
  /* the frame rail stands 6 mm proud of the sill instead of flush with it */
  g.add(bbox(fx0 - MW, fx1 + MW, GL_BOT - 0.049, GL_BOT + 0.006, ST_Z1 - 0.10, ST_Z1 + 0.02, MS.mullD));
  /* transom above the door head */
  g.add(bbox(jamb0, jamb1, 2.24, 2.30, ST_Z1 - 0.10, ST_Z1 + 0.02, MS.mullD));
  for (i = 0; i < mulX.length - 1; i++) {
    var a = mulX[i], b = mulX[i + 1];
    if (a === jamb0 && b === jamb1) continue;         // the doorway
    g.add(glassPane(b - a - MW, gh, (a + b) / 2, gy, dz, 0));
  }
  /* fixed light over the doorway */
  g.add(glassPane(jamb1 - jamb0 - MW, GL_TOP - 2.30, (jamb0 + jamb1) / 2, (2.30 + GL_TOP) / 2, dz, 0));

  /* --- east elevation --- */
  var ez0 = -4.46, ez1 = ST_Z1 - 0.02;
  var dx = ST_X1 + 0.035;
  var mulZ = [ez0, -3.44, -2.42, ez1];
  for (i = 0; i < mulZ.length; i++) {
    g.add(bbox(ST_X1 - 0.02, ST_X1 + 0.10, GL_BOT - 0.02, GL_TOP + 0.06, mulZ[i] - MW / 2, mulZ[i] + MW / 2, MS.mull));
  }
  g.add(bbox(ST_X1 - 0.02, ST_X1 + 0.10, GL_TOP, GL_TOP + 0.075, ez0 - MW, ez1 + MW, MS.mullD));
  g.add(bbox(ST_X1 - 0.02, ST_X1 + 0.10, GL_BOT - 0.049, GL_BOT + 0.006, ez0 - MW, ez1 + MW, MS.mullD));
  for (i = 0; i < mulZ.length - 1; i++) {
    g.add(glassPane(mulZ[i + 1] - mulZ[i] - MW, gh, dx, gy, (mulZ[i] + mulZ[i + 1]) / 2, PI / 2));
  }
  /* corner post */
  g.add(bbox(ST_X1 - 0.05, ST_X1 + 0.10, GL_BOT - 0.06, GL_TOP + 0.08, ST_Z1 - 0.10, ST_Z1 + 0.02, MS.mull));
})();

/* ============================================================================
   AUTOMATIC DOOR
   ========================================================================== */
(function autoDoor() {
  var g = new T.Group(); storeGrp.add(g);
  var jamb0 = DOOR_CX - DOOR_HW, jamb1 = DOOR_CX + DOOR_HW;
  var dz = ST_Z1 - 0.035;
  var leafW = DOOR_HW - 0.015, leafH = 2.24 - GL_BOT - 0.02;
  var leafY = GL_BOT + leafH / 2 + 0.01;

  g.add(bbox(jamb0 - 0.10, jamb1 + 0.10, 2.30, 2.42, ST_Z1 - 0.12, ST_Z1 + 0.03, MS.mullD));
  /* sensor pod */
  var pod = box(0.34, 0.075, 0.10, MS.mull, DOOR_CX, 2.475, ST_Z1 + 0.02);
  g.add(pod);
  var podLed = box(0.05, 0.026, 0.02, flat(0x67f0a4), DOOR_CX + 0.12, 2.475, ST_Z1 + 0.075);
  g.add(podLed); NO_OUTLINE.push(podLed);

  /* threshold */
  g.add(bbox(jamb0 - 0.06, jamb1 + 0.06, GL_BOT - 0.06, GL_BOT + 0.015, ST_Z1 - 0.13, ST_Z1 + 0.04, MS.mullD));

  function leaf(sign) {
    var lg = new T.Group();
    var cx = DOOR_CX + sign * (DOOR_HW / 2);
    /* frame */
    var fr = MS.mull;
    lg.add(bbox(cx - leafW / 2, cx - leafW / 2 + 0.05, leafY - leafH / 2, leafY + leafH / 2, dz - 0.03, dz + 0.03, fr));
    lg.add(bbox(cx + leafW / 2 - 0.05, cx + leafW / 2, leafY - leafH / 2, leafY + leafH / 2, dz - 0.03, dz + 0.03, fr));
    lg.add(bbox(cx - leafW / 2, cx + leafW / 2, leafY + leafH / 2 - 0.055, leafY + leafH / 2, dz - 0.03, dz + 0.03, fr));
    lg.add(bbox(cx - leafW / 2, cx + leafW / 2, leafY - leafH / 2, leafY - leafH / 2 + 0.13, dz - 0.03, dz + 0.03, fr));
    var pane = glassPane(leafW - 0.10, leafH - 0.20, cx, leafY + 0.035, dz, 0, MS.glassDoor);
    lg.add(pane);
    /* the warning sticker every Japanese automatic door carries */
    var st = plane(0.30, 0.20, flat(0xf5e14a, { transparent: true, opacity: 0.92 }), cx, leafY + 0.42, dz + 0.012);
    st.renderOrder = 6; NO_OUTLINE.push(st);
    lg.add(st);

    st2.renderOrder = 6; NO_OUTLINE.push(st2);

})();

function fillShelf(g, x0, x1, y, z, depth, tiers, seed) {
  /* rows of small packages standing on a shelf tier */
  RNG = mulberry32(seed);
  var x = x0 + 0.03;
  while (x < x1 - 0.05) {
    var w = rr(0.075, 0.155);
    if (x + w > x1 - 0.03) break;
    var h = rr(0.14, 0.235);

      var cap = box(w * 0.93, h * 0.20, d * 1.005, PMAT[ri(0, PMAT.length - 1)], x + w / 2, y + h * 0.86, z);

function fillBottles(g, x0, x1, y, z, seed, rmin, rmax, hmin, hmax) {
  RNG = mulberry32(seed);
  var x = x0 + 0.05;
  while (x < x1 - 0.06) {
    var r = rr(rmin || 0.037, rmax || 0.052);
    if (x + r * 2 > x1 - 0.03) break;
    var h = rr(hmin || 0.17, hmax || 0.27);
    var m = PMAT[ri(0, PMAT.length - 1)];
    var b = cyl(r, r, h, 8, m, x + r, y + h / 2, z);
    b.castShadow = false;
    g.add(b);
    var neck = cyl(r * 0.42, r * 0.55, h * 0.16, 8, I.cream, x + r, y + h + h * 0.07, z);
    neck.castShadow = false;
    g.add(neck); NO_OUTLINE.push(neck);
    x += r * 2 + rr(0.006, 0.020);
  }
}

/* ============================================================================
   GONDOLA SHELVING  -- aisles run away from the window so you see down them
   ========================================================================== */
(function gondolas() {
  var xs = [-4.35, -2.85, -1.35];
  var z0 = -5.30, z1 = -2.85, W = 0.78, H = 1.34;
  for (var i = 0; i < xs.length; i++) {
    var g = new T.Group(); inGrp.add(g);
    var cx = xs[i];
    /* spine + base kick */
    g.add(bbox(cx - 0.025, cx + 0.025, FY, FY + H, z0, z1, I.shelfD));
    g.add(bbox(cx - W / 2, cx + W / 2, FY, FY + 0.13, z0, z1, I.shelfD));
    g.add(bbox(cx - W / 2, cx + W / 2, FY + H, FY + H + 0.05, z0, z1, I.shelf));
    /* end panel at the back only -- the aisle-facing end stays open so the
       shot from the street looks straight down between the runs */
    g.add(bbox(cx - W / 2, cx + W / 2, FY, FY + H, z0, z0 + 0.035, I.shelf));
    /* tiers, both faces */
    var tiers = [0.30, 0.58, 0.86, 1.13];
    for (var t = 0; t < tiers.length; t++) {
      var sy = FY + tiers[t];
      g.add(bbox(cx - W / 2 + 0.01, cx - 0.03, sy, sy + 0.020, z0 + 0.04, z1 - 0.04, I.shelf));
      g.add(bbox(cx + 0.03, cx + W / 2 - 0.01, sy, sy + 0.020, z0 + 0.04, z1 - 0.04, I.shelf));
      /* stock along each side, laid out down the aisle */
      var seed = 3300 + i * 97 + t * 13;
      RNG = mulberry32(seed);
      var z = z0 + 0.08;
      while (z < z1 - 0.10) {
        var w = rr(0.09, 0.17);
        if (z + w > z1 - 0.06) break;
        var h = rr(0.13, 0.21);
        var mA = PMAT[ri(0, PMAT.length - 1)], mB = PMAT[ri(0, PMAT.length - 1)];
        var a = box(0.30, h, w * 0.92, mA, cx - 0.19, sy + 0.020 + h / 2, z + w / 2);
        var b = box(0.30, h, w * 0.92, mB, cx + 0.19, sy + 0.020 + h / 2, z + w / 2);
        a.castShadow = false; b.castShadow = false;
        g.add(a, b);
        z += w + rr(0.005, 0.020);
      }
      /* price rails */
      var r1 = box(0.02, 0.030, z1 - z0 - 0.10, I.white, cx - W / 2 + 0.015, sy + 0.028, (z0 + z1) / 2);
      var r2 = box(0.02, 0.030, z1 - z0 - 0.10, I.white, cx + W / 2 - 0.015, sy + 0.028, (z0 + z1) / 2);
      r1.castShadow = false; r2.castShadow = false;
      g.add(r1, r2); NO_OUTLINE.push(r1, r2);
    }
    /* end-cap header card */
    var card = plane(W - 0.10, 0.20, flat(0xffe9c0), cx, FY + H + 0.16, z1 + 0.005);
    card.renderOrder = 2;
    g.add(card); NO_OUTLINE.push(card);
    g.add(bbox(cx - W / 2 + 0.05, cx + W / 2 - 0.05, FY + H + 0.05, FY + H + 0.27, z1 - 0.04, z1, I.shelf));
  }
})();

/**
 * @param face  direction the machine looks at: 0=+Z, 1=+X, 2=-Z, 3=-X
 */
function vendingMachine(x, z, face, bodyMat, seed, bandCol, y0g) {
  var g = new T.Group();
  g.position.set(x, y0g || 0, z);
  g.rotation.y = face * PI / 2;
  propGrp.add(g);

  var W = 1.05, H = 1.86, D = 0.74, FZ = D / 2;
  var BW = 0.90, BY0 = 0.72, BY1 = 1.64, BD = 0.20;   // product bay
  var BZ0 = FZ - BD;                                   // back of the bay

  /* ---- carcass, split around the bay so the recess is genuine ----
     The shell stops at HB, below the top cap, and the plinth starts below zero:
     a cap flush with the body gives coplanar faces that flicker against each
     other and make the outline pass draw a seam across the lid. */
  var HB = H - 0.06;                                                          // top of the shell
  g.add(box(W, HB, D - BD, bodyMat, 0, HB / 2, -BD / 2));                     // main body
  g.add(box(W, BY0, BD, bodyMat, 0, BY0 / 2, FZ - BD / 2));                   // front, below bay
  g.add(box(W, HB - BY1, BD, bodyMat, 0, (BY1 + HB) / 2, FZ - BD / 2));       // front, above bay
  for (var s = -1; s <= 1; s += 2) {                                          // side pillars
    g.add(box((W - BW) / 2, BY1 - BY0, BD, bodyMat,
      s * (BW + (W - BW) / 2) / 2, (BY0 + BY1) / 2, FZ - BD / 2));
  }
  g.add(box(W + 0.03, 0.09, D + 0.03, P.vendDark, 0, 0.035, 0));              // plinth
  g.add(box(W + 0.02, 0.08, D + 0.02, P.vendDark, 0, H - 0.04, 0));           // top cap

  /* ---- brand band ---- */
  g.add(box(W - 0.03, 0.16, 0.026, flat(bandCol), 0, BY1 + 0.08, FZ + 0.005));
  for (var t = 0; t < 3; t++) {                                              // a geometric mark
    g.add(box(0.045, 0.085 - t * 0.020, 0.014, flat(0xfff6e2),
      -0.30 + t * 0.055, BY1 + 0.08, FZ + 0.020));
  }

  /* ---- lit back panel of the bay ---- */
  var lit = box(BW - 0.015, BY1 - BY0 - 0.015, 0.014,
    flat(0xf4f9ff, { uniq: 1 }), 0, (BY0 + BY1) / 2, BZ0 + 0.010);
  lit.castShadow = false;
  g.add(lit); NO_OUTLINE.push(lit);
  VEND_GLOW.push({ m: lit.material, base: 1.0, sp: 0.6 + Math.abs(x) * 0.11 });
  /* bay reveal: a dark liner so the recess reads even when the lamp dips */
  g.add(box(BW, 0.016, BD - 0.02, P.vendDark, 0, BY0 + 0.008, FZ - BD / 2 - 0.01));
  g.add(box(BW, 0.016, BD - 0.02, P.vendDark, 0, BY1 - 0.008, FZ - BD / 2 - 0.01));

  /* ---- three shelves of product ---- */
  RNG = mulberry32(seed);
  for (var sh = 0; sh < 3; sh++) {
    var sy = BY0 + 0.055 + sh * 0.300;
    g.add(box(BW - 0.02, 0.016, BD - 0.035, P.vendShelf, 0, sy, FZ - BD / 2 - 0.006));
    /* the red price rail every Japanese machine has along each shelf lip */
    g.add(box(BW - 0.02, 0.030, 0.014, flat(0xdc4a44), 0, sy + 0.020, FZ - 0.042));
    g.add(box(BW - 0.02, 0.016, 0.014, flat(0xf7edd6), 0, sy - 0.004, FZ - 0.042));
    for (var c = 0; c < 5; c++) {
      drinkItem(g, -0.34 + c * 0.17, sy + 0.008, FZ - 0.108, ri(0, 2), ri(0, 8));
    }
  }

  /* ---- glass ---- */
  var gl = box(BW + 0.006, BY1 - BY0 + 0.006, 0.012, P.vendGlass, 0, (BY0 + BY1) / 2, FZ - 0.014);
  gl.castShadow = false; gl.receiveShadow = false;
  g.add(gl);

  /* ---- selection buttons ---- */
  g.add(box(BW, 0.12, 0.022, P.vendDark, 0, BY0 - 0.085, FZ + 0.004));
  for (var b = 0; b < 5; b++) {
    var btn = box(0.095, 0.052, 0.020, flat(b === 2 ? 0xff8a5c : 0xffd9a0),
      -0.34 + b * 0.17, BY0 - 0.085, FZ + 0.020);
    g.add(btn); NO_OUTLINE.push(btn);
  }

  /* ---- coin mech + change tray ---- */
  g.add(box(0.30, 0.30, 0.024, P.vendDark, 0.315, 0.44, FZ + 0.006));
  var coin = box(0.050, 0.014, 0.018, flat(0xdfe8f0), 0.315, 0.545, FZ + 0.022);
  g.add(coin); NO_OUTLINE.push(coin);
  var price = box(0.19, 0.055, 0.016, flat(0x6cf0a8), 0.315, 0.375, FZ + 0.022);
  g.add(price); NO_OUTLINE.push(price);
  g.add(box(0.20, 0.09, 0.030, P.vendDark, 0.315, 0.215, FZ + 0.012));
  g.add(box(0.16, 0.05, 0.016, M.dark, 0.315, 0.205, FZ + 0.030));

  /* ---- delivery flap ---- */
  g.add(box(0.50, 0.24, 0.028, P.vendDark, -0.20, 0.215, FZ + 0.008));
  g.add(box(0.44, 0.18, 0.018, P.rubber, -0.20, 0.215, FZ + 0.026));
  return g;
}

/* ============================================================================
   BICYCLES
   Built along local +X (front) with local +Z to the rider's left, so a rack of
   them parks side by side once the group is yawed a quarter turn.
   ========================================================================== */
P.frameGreen = toon(0x4a7a5c, { rim: 0.28, ramp: 3 });
P.grip = toon(0x2a2932, { rim: 0.18, ramp: 2 });
P.saddle = toon(0x241f28, { rim: 0.20, ramp: 2 });
P.spoke = toon(0xa9aeb8, { rim: 0.34, rimStart: 0.36, ramp: 3 });

function bicycle(x, z, ry, frameMat, basket) {
  var g = new T.Group();
  g.position.set(x, APRON_Y, z);
  /* ZYX puts the X rotation innermost, so it leans the machine sideways about
     its own wheelbase.  With the default XYZ order a Z rotation tipped the nose
     up in the air instead. */
  g.rotation.order = 'ZYX';
  g.rotation.y = ry;
  g.rotation.x = 0.055;
  propGrp.add(g);

  var R = 0.325, WB = 1.00, FA = WB / 2, RA = -WB / 2;

  /* ---- wheels ---- */
  function wheel(px, guardArc, guardRot) {
    var w = new T.Group();
    w.position.set(px, R, 0);
    g.add(w);
    /* TorusGeometry already lies in XY with its axle on Z, which is the plane
       a wheel rolling along X needs -- no extra rotation. */
    w.add(mesh(torG(R, 0.032, 6, 22), P.tyre, 0, 0, 0));
    w.add(mesh(torG(R - 0.048, 0.013, 5, 22), P.spoke, 0, 0, 0));
    for (var s = 0; s < 6; s++) {
      var sp = box(0.007, (R - 0.055) * 2, 0.007, P.spoke, 0, 0, 0);
      sp.rotation.z = s / 6 * PI;
      sp.castShadow = false;
      w.add(sp); NO_OUTLINE.push(sp);
    }
    var hub = cyl(0.030, 0.030, 0.052, 8, P.spoke, 0, 0, 0);
    hub.rotation.x = PI / 2; w.add(hub);                       // axle on Z
    /* mudguard hugging the top of the tyre, in the wheel plane.  guardRot spins
       the partial arc round to sit on top. */
    var mg = mesh(new T.TorusGeometry(R + 0.042, 0.015, 4, 16, guardArc), P.spoke, 0, 0, 0);
    mg.rotation.z = guardRot;
    w.add(mg);
    return w;
  }
  wheel(RA, PI * 0.80, PI * 0.10);
  wheel(FA, PI * 0.62, PI * 0.20);

  /* ---- frame ---- */
  var bb = [-0.075, 0.275];            // bottom bracket
  var seatT = [-0.245, 0.775];         // top of the seat tube
  var headT = [0.325, 0.845];          // top of the head tube
  var headB = [0.400, 0.520];          // bottom of the head tube
  function bar(a, b, r, dz) {
    g.add(link(a[0], a[1], dz || 0, b[0], b[1], dz || 0, r, frameMat, 8));
  }
  bar(bb, seatT, 0.021);                                   // seat tube
  bar(bb, headB, 0.023);                                   // down tube
  bar(seatT, headT, 0.020);                                // top tube
  bar(headB, headT, 0.024);                                // head tube
  for (var sd = -1; sd <= 1; sd += 2) {
    bar([RA, R], bb, 0.014, sd * 0.048);                   // chainstays
    bar([RA, R], seatT, 0.013, sd * 0.042);                // seat stays
    bar(headB, [FA, R], 0.014, sd * 0.045);                // fork blades
  }
  /* fork crown + dropouts */
  g.add(cyl(0.026, 0.026, 0.10, 8, frameMat, headB[0], headB[1], 0).rotateX(PI / 2));

  /* ---- saddle on a seat post ---- */
  g.add(cyl(0.014, 0.014, 0.14, 7, P.spoke, seatT[0] - 0.012, seatT[1] + 0.055, 0));
  var sd2 = box(0.20, 0.045, 0.115, P.saddle, seatT[0] - 0.035, seatT[1] + 0.145, 0);
  g.add(sd2);
  g.add(box(0.085, 0.038, 0.055, P.saddle, seatT[0] + 0.085, seatT[1] + 0.143, 0));

  /* ---- stem + handlebar ---- */
  g.add(cyl(0.017, 0.017, 0.11, 7, P.spoke, headT[0], headT[1] + 0.050, 0));
  g.add(box(0.10, 0.030, 0.030, P.spoke, headT[0] + 0.035, headT[1] + 0.098, 0));
  var hb = cyl(0.014, 0.014, 0.40, 7, P.spoke, headT[0] + 0.070, headT[1] + 0.098, 0);
  hb.rotation.x = PI / 2;
  g.add(hb);
  for (var hs = -1; hs <= 1; hs += 2) {
    var grip = cyl(0.019, 0.019, 0.095, 8, P.grip, headT[0] + 0.070, headT[1] + 0.098, hs * 0.152);
    grip.rotation.x = PI / 2;                                  // along the bar, not upright
    g.add(grip);
    var lev = box(0.075, 0.016, 0.016, P.spoke, headT[0] + 0.028, headT[1] + 0.082, hs * 0.105);
    lev.rotation.z = -0.34;
    g.add(lev);
  }
  /* bell */
  g.add(cyl(0.024, 0.024, 0.020, 10, P.spoke, headT[0] + 0.070, headT[1] + 0.118, 0.075));

  /* ---- chainring, cranks, pedals ---- */
  var ring = cyl(0.072, 0.072, 0.012, 14, P.spoke, bb[0], bb[1], 0.052);
  ring.rotation.x = PI / 2;                                    // same axle as the wheels
  g.add(ring);
  g.add(cyl(0.020, 0.020, 0.14, 8, P.spoke, bb[0], bb[1], 0).rotateX(PI / 2));
  for (var cr = -1; cr <= 1; cr += 2) {
    var arm = box(0.155, 0.022, 0.018, P.spoke, bb[0] + cr * 0.055, bb[1] - cr * 0.048, cr * 0.062);
    arm.rotation.z = cr * 0.72;
    g.add(arm);
    g.add(box(0.085, 0.018, 0.045, P.grip, bb[0] + cr * 0.115, bb[1] - cr * 0.098, cr * 0.075));
  }
  /* chain + guard */
  g.add(box(WB / 2 - 0.05, 0.014, 0.012, P.rubber,
    (bb[0] + RA) / 2, (bb[1] + R) / 2 + 0.012, 0.052));
  var cgd = box(0.30, 0.085, 0.010, P.plastic, bb[0] - 0.055, bb[1] + 0.030, 0.066);
  g.add(cgd);

  /* ---- rear rack ---- */
  g.add(box(0.34, 0.016, 0.19, P.spoke, RA + 0.13, 0.645, 0));
  for (var rr2 = -1; rr2 <= 1; rr2 += 2) {
    g.add(link(RA + 0.02, 0.638, rr2 * 0.085, RA + 0.02, R + 0.02, rr2 * 0.055, 0.010, P.spoke, 6));
    g.add(link(RA + 0.26, 0.638, rr2 * 0.085, seatT[0] + 0.02, seatT[1] - 0.10, rr2 * 0.040, 0.010, P.spoke, 6));
  }

  /* ---- front basket: a wire cage, not a solid block ---- */
  if (basket) {
    var bk = new T.Group();
    bk.position.set(FA + 0.055, 0.735, 0);
    g.add(bk);
    bk.add(box(0.26, 0.012, 0.24, P.spoke, 0, -0.105, 0));                 // floor
    for (var wl = 0; wl < 3; wl++) {                                        // horizontal wires
      var yy = -0.075 + wl * 0.072;
      bk.add(box(0.27, 0.010, 0.010, P.spoke, 0, yy, 0.118));
      bk.add(box(0.27, 0.010, 0.010, P.spoke, 0, yy, -0.118));
      bk.add(box(0.010, 0.010, 0.245, P.spoke, 0.132, yy, 0));
      bk.add(box(0.010, 0.010, 0.245, P.spoke, -0.132, yy, 0));
    }
    for (var cp = 0; cp < 4; cp++) {                                        // corner uprights
      bk.add(box(0.012, 0.20, 0.012, P.spoke,
        (cp < 2 ? 1 : -1) * 0.130, -0.008, (cp % 2 ? 1 : -1) * 0.116));
    }
    /* bracket back to the head tube */
    bk.add(link(-0.13, -0.10, 0, -0.30, -0.19, 0, 0.011, P.spoke, 6));

/** a furled umbrella standing tip-down: ferrule, ribbed canopy, tie, J handle */
function umbrella(parent, x, y, z, col, rotY) {
  var u = new T.Group();
  u.position.set(x, y, z);
  u.rotation.y = rotY || 0;
  parent.add(u);
  var fab = toon(col, { rim: 0.24, ramp: 2 });
  var stick = P.railWhite;
  /* ferrule tip and shaft */
  u.add(cyl(0.004, 0.013, 0.075, 7, stick, 0, 0.038, 0));
  u.add(cyl(0.0105, 0.0105, 0.80, 6, stick, 0, 0.44, 0));
  /* furled canopy: wide under the handle, tapering to the tip */
  u.add(cyl(0.048, 0.020, 0.40, 9, fab, 0, 0.50, 0));
  u.add(cyl(0.020, 0.008, 0.10, 8, fab, 0, 0.255, 0));
  /* rib ridges, so it reads as folded fabric rather than a cone */
  for (var r = 0; r < 6; r++) {
    var a = r / 6 * TAU;
    var rb = box(0.007, 0.38, 0.007, fab,
      Math.cos(a) * 0.036, 0.505, Math.sin(a) * 0.036);
    rb.rotation.z = -Math.cos(a) * 0.055;
    rb.rotation.x = Math.sin(a) * 0.055;
    rb.castShadow = false;
    u.add(rb); NO_OUTLINE.push(rb);
  }
  /* tie strap */
  u.add(cyl(0.044, 0.044, 0.030, 10, toon(0x3a3a46, { rim: 0.18, ramp: 2 }), 0, 0.60, 0));
  /* J hook handle */
  u.add(cyl(0.013, 0.013, 0.085, 7, P.grip, 0, 0.882, 0));
  var hook = mesh(new T.TorusGeometry(0.043, 0.013, 5, 10, PI), P.grip, 0.043, 0.924, 0);
  u.add(hook);
  return u;
}

/* ============================================================================
   NEIGHBOURING BUILDINGS -- dark masses that box the corner in
   ========================================================================== */
function litWindows(g, x0, x1, y0, y1, z, ry, cols, rows, seed, faceOut) {
  RNG = mulberry32(seed);
  var w = (x1 - x0) / cols, h = (y1 - y0) / rows;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var lit = RNG();
      var mat = lit > 0.68 ? (lit > 0.88 ? S.winLitB : S.winLit) : S.winDark;
      var pw = w * 0.44, ph = h * 0.40;
      var px = x0 + w * (c + 0.5), py = y0 + h * (r + 0.5);
      var pn = plane(pw, ph, mat, ry ? z : px, py, ry ? px : z);
      if (ry) pn.rotation.y = faceOut ? PI / 2 : -PI / 2;
      else if (faceOut === false) pn.rotation.y = PI;
      pn.renderOrder = 1;
      g.add(pn); NO_OUTLINE.push(pn);
      /* frame */
      var fr = plane(pw + 0.07, ph + 0.07, S.nbTrim, pn.position.x, py, pn.position.z);
      fr.rotation.copy(pn.rotation);
      fr.position.add(new T.Vector3(
        ry ? (faceOut ? -0.012 : 0.012) : 0, 0,
        ry ? 0 : (faceOut === false ? 0.012 : -0.012)));
      g.add(fr); NO_OUTLINE.push(fr);
    }
  }
}

     the top of the flight hanging in the yard with nothing to arrive at.  It now
     runs along the facade and lands on the first-floor walkway. */
  (function stair() {
    var SZ0 = -7.70, SZ1 = -6.95;                 // flight width, south of the walkway
    var X_BOT = 2.20, X_TOP = 0.40;               // climbs east -> west
    var Y_BOT = 0.10, Y_TOP = 1.72;               // walkway deck level
    var N = 10, dx = (X_TOP - X_BOT) / N, dy = (Y_TOP - Y_BOT) / N;
    for (var st = 0; st < N; st++) {
      var xa = X_BOT + dx * (st + 1), xb = X_BOT + dx * st;
      var y = Y_BOT + dy * (st + 1);
      g.add(bbox(xa, xb, y - 0.055, y, SZ0, SZ1, S.nbTrim));                              // tread
      g.add(bbox(xa - 0.02, xa + 0.03, y - dy - 0.055, y - 0.055, SZ0, SZ1, S.nbWallL));  // riser
    }
    /* stringers under the treads */
    var run = X_BOT - X_TOP, rise = Y_TOP - Y_BOT;
    var slope = Math.atan2(rise, run), len = Math.sqrt(run * run + rise * rise);
    [SZ0 + 0.03, SZ1 - 0.03].forEach(function (sz) {
      var sg = box(len + 0.10, 0.15, 0.055, S.nbTrim,
        (X_BOT + X_TOP) / 2, (Y_BOT + Y_TOP) / 2 - 0.12, sz);
      /* negative: the flight falls as x grows, so +X must tilt DOWN */
      sg.rotation.z = -slope;
      g.add(sg);
    });
    /* top landing, stopping just short of the walkway slab so nothing overlaps */
    g.add(bbox(0.02, X_TOP, Y_TOP - 0.06, Y_TOP, -7.72, SZ1, S.nbTrim));
    /* handrail down the outer stringer */
    var hy = 0.92;
    var hr = box(len + 0.06, 0.045, 0.045, S.nbTrim,
      (X_BOT + X_TOP) / 2, (Y_BOT + Y_TOP) / 2 + hy, SZ1 - 0.05);
    hr.rotation.z = -slope;
    g.add(hr);
    for (var p = 0; p <= 4; p++) {
      var t = p / 4, px = X_BOT + (X_TOP - X_BOT) * t, py = Y_BOT + rise * t;
      g.add(box(0.045, hy + 0.10, 0.045, S.nbTrim, px, py + hy / 2, SZ1 - 0.05));
    }
    g.add(box(0.045, hy + 0.10, 0.045, S.nbTrim, 0.06, Y_TOP + hy / 2 - 0.05, SZ1 - 0.05));

var POLES = {};
function utilityPole(name, x, z, h, opts) {
  opts = opts || {};
  var g = new T.Group();
  g.position.set(x, CURB_Y, z);
  streetGrp.add(g);
  g.add(cyl(0.115, 0.165, h, 12, S.poleCon, 0, h / 2, 0));
  /* the ring joints every real concrete pole has */
  for (var r = 1; r < 4; r++) {
    var ry = h * r / 4;
    var rg = cyl(0.152 - r * 0.010, 0.152 - r * 0.010, 0.05, 12, S.poleConD, 0, ry, 0);
    g.add(rg);
  }
  /* footing */
  g.add(cyl(0.26, 0.30, 0.16, 12, M.concreteD, 0, 0.02, 0));

  /* crossarms + insulators */
  var arms = opts.arms || [h - 0.45, h - 1.05];
  for (var a = 0; a < arms.length; a++) {
    var ay = arms[a];
    var arm = box(1.70, 0.075, 0.075, S.armSteel, 0, ay, 0);
    arm.rotation.y = opts.armRot || 0;
    g.add(arm);
    for (var i = -1; i <= 1; i++) {
      if (i === 0) continue;
      var ix = i * 0.66, iz = 0;
      if (opts.armRot) { iz = i * 0.66; ix = 0; }
      var ins = cyl(0.052, 0.062, 0.11, 8, toon(0x7a8290, { rim: 0.26, ramp: 3 }), ix, ay + 0.09, iz);
      g.add(ins);
      var insT = cyl(0.032, 0.044, 0.05, 8, toon(0x6a7280, { rim: 0.24, ramp: 3 }), ix, ay + 0.17, iz);
      g.add(insT);
    }
    var insC = cyl(0.052, 0.062, 0.11, 8, toon(0x7a8290, { rim: 0.26, ramp: 3 }), 0, ay + 0.09, 0);
    g.add(insC);
  }

  /* transformer cans */
  if (opts.trafo) {
    var ty = h - 1.85;
    [[-0.42, 0], [0.42, 0]].forEach(function (p) {
      g.add(cyl(0.20, 0.20, 0.62, 12, toon(0x8d919c, { rim: 0.24, ramp: 3 }), p[0], ty, p[1]));
      g.add(cyl(0.215, 0.215, 0.05, 12, toon(0x74788a, { rim: 0.22, ramp: 3 }), p[0], ty + 0.34, p[1]));
      g.add(cyl(0.215, 0.215, 0.05, 12, toon(0x74788a, { rim: 0.22, ramp: 3 }), p[0], ty - 0.34, p[1]));
    });
    g.add(box(1.00, 0.07, 0.07, S.armSteel, 0, ty + 0.42, 0));
  }
  /* cable coil + riser conduit */
  var coil = mesh(torG(0.24, 0.05, 6, 14), M.blackSoft, 0, h - 2.75, 0.20);
  coil.rotation.y = 0.4;
  g.add(coil);
  g.add(box(0.075, h - 3.2, 0.075, toon(0x5e5b68, { rim: 0.18, ramp: 2 }), 0.14, (h - 3.2) / 2, 0.06));

  /* pole number plate */
  var pl = plane(0.14, 0.34, flat(0xdfe2e8), 0, 1.62, 0.172);
  g.add(pl); NO_OUTLINE.push(pl);

  POLES[name] = { g: g, x: x, z: z, h: h, y0: CURB_Y };
  return g;
}

(function overhead() {
  var g = new T.Group(); streetGrp.add(g);
  function run(a, b, ys, sag) {
    var A = POLES[a], B = POLES[b];
    for (var i = 0; i < ys.length; i++) {
      var off = (i - (ys.length - 1) / 2) * 0.62;
      var p0 = new T.Vector3(A.x + (A.z === B.z ? 0 : off), A.y0 + ys[i], A.z + (A.z === B.z ? off : 0));
      var p1 = new T.Vector3(B.x + (A.z === B.z ? 0 : off), B.y0 + ys[i], B.z + (A.z === B.z ? off : 0));
      var w = tube(sagPoints(p0, p1, sag, 12), 0.022, M.wire, 14);
      g.add(w); NO_OUTLINE.push(w);
    }
  }
  function runTo(a, x, z, ys, sag) {
    var A = POLES[a];
    for (var i = 0; i < ys.length; i++) {
      var off = (i - (ys.length - 1) / 2) * 0.62;
      var horiz = Math.abs(x - A.x) > Math.abs(z - A.z);
      var p0 = new T.Vector3(A.x + (horiz ? 0 : off), A.y0 + ys[i], A.z + (horiz ? off : 0));
      var p1 = new T.Vector3(x + (horiz ? 0 : off), A.y0 + ys[i] - 0.35, z + (horiz ? off : 0));
      var w = tube(sagPoints(p0, p1, sag, 10), 0.022, M.wire, 12);
      g.add(w); NO_OUTLINE.push(w);
    }
  }
  run('A', 'B', [7.15, 6.55, 5.95], 0.62);
  run('A', 'C', [7.15, 6.55], 0.55);
  run('A', 'D', [6.85, 6.25], 0.40);
  run('D', 'E', [6.85, 6.25], 0.42);
  runTo('C', -HALF, 3.55, [7.15, 6.55], 0.30);
  runTo('B', 3.38, -HALF, [6.65, 6.05], 0.26);
  runTo('E', 9.32, HALF, [6.45, 5.85], 0.22);
  runTo('E', HALF, 9.62, [6.45], 0.18);
  /* a couple of service drops down to the buildings */
  var dp = tube([
    new T.Vector3(3.38 - 0.4, CURB_Y + 5.95, -7.20),
    new T.Vector3(2.60, CURB_Y + 5.30, -7.80),

  ], 0.020, M.wire, 10);
  g.add(dp); NO_OUTLINE.push(dp);
  var dp2 = tube([
    new T.Vector3(-8.30 + 0.35, CURB_Y + 6.05, 3.55),

    new T.Vector3(-8.95, CURB_Y + 4.30, 0.10)
  ], 0.020, M.wire, 10);
  g.add(dp2); NO_OUTLINE.push(dp2);
  /* drop to the shop roof */
  var dp3 = tube([
    new T.Vector3(3.38 - 0.5, CURB_Y + 6.55, 3.60),

  g.add(dp3); NO_OUTLINE.push(dp3);
})();

function streetLamp(poleName, dir) {
  var P0 = POLES[poleName];
  var g = new T.Group();
  g.position.set(P0.x, P0.y0, P0.z);

  var armY = 4.55, reach = 1.45;

  g.add(link(0, armY - 0.55, 0, ax * 0.55, armY + 0.14, az * 0.55, 0.030, S.armSteel));
  /* the flat fluorescent lantern used all over Japanese back streets */
  var head = new T.Group();
  head.position.set(ax, armY + 0.28, az);
  g.add(head);
  head.add(box(0.72, 0.11, 0.34, S.armSteel, 0, 0, 0));
  head.add(box(0.62, 0.05, 0.28, toon(0xb6bcc6, { rim: 0.28, ramp: 3 }), 0, -0.06, 0));
  var lens = decal(0.60, 0.26, flat(0xf2f8ff), 0, -0.088, 0);
  head.add(lens); NO_OUTLINE.push(lens);
  var hl = halo(4.4, 0xd6ecff, 0.42);
  hl.position.set(0, -0.30, 0);
  head.add(hl);
  LAMP_HALOS.push({ m: hl.material, base: 0.40, sp: 0.9 });
  /* a downward light cone, very faint */
  var cone = mesh(new T.CylinderGeometry(0.28, 2.05, 4.55, 18, 1, true),
    flat(0xcfe4ff, {
      map: coneTex(), transparent: true, opacity: 0.038, blend: 'add',

    }), 0, -2.34, 0);
  cone.material.side = T.FrontSide;
  cone.renderOrder = 7;
  cone.castShadow = false; cone.receiveShadow = false;
  head.add(cone); NO_OUTLINE.push(cone);
  return { g: g, world: new T.Vector3(P0.x + ax, P0.y0 + armY + 0.20, P0.z + az) };
}

   ========================================================================== */
function signalHead(parent, x, y, z, ry, store, scale) {
  var s = scale || 1;
  var g = new T.Group();
  g.position.set(x, y, z);
  g.rotation.y = ry;
  g.scale.setScalar(s);
  parent.add(g);
  g.add(box(1.05, 0.34, 0.22, toon(0x4e5460, { rim: 0.22, ramp: 3 }), 0, 0, 0));
  g.add(box(1.09, 0.06, 0.24, toon(0x3d424c, { rim: 0.20, ramp: 3 }), 0, 0.18, 0));
  var cols = [0x5ce89a, 0xffb03a, 0xff5a5a];      // green, amber, red (JP order L->R)
  for (var i = 0; i < 3; i++) {
    var lx = -0.33 + i * 0.33;
    g.add(cyl(0.125, 0.125, 0.05, 14, toon(0x3d424c, { rim: 0.20, ramp: 3 }), lx, 0, 0.125).rotateX(PI / 2));
    var lens = cyl(0.105, 0.105, 0.02, 14, flat(cols[i], { uniq: 1 }), lx, 0, 0.152);
    lens.rotation.x = PI / 2;
    g.add(lens); NO_OUTLINE.push(lens);
    /* hood */
    var hood = mesh(new T.CylinderGeometry(0.135, 0.135, 0.14, 14, 1, true, PI * 0.05, PI * 0.90),
      toon(0x454b56, { rim: 0.20, ramp: 3 }), lx, 0.02, 0.20);
    hood.rotation.x = PI / 2;
    g.add(hood);
    var hl = halo(0.95, cols[i], 0.0);
    hl.position.set(lx, 0, 0.30);
    g.add(hl);
    store.lamps.push(lens.material);
    store.glow.push(hl.material);
  }
  return g;
}

/* ============================================================================
   RAIN
   Four separate systems: the falling curtain, splash crowns where it lands,
   drips shedding off the canopy edges, and water running down the glass.
   All of them are single instanced draw calls driven entirely on the GPU.
   ========================================================================== */
var rainGrp = new T.Group();
scene.add(rainGrp);

var WIND = new T.Vector3(0.19, -1.0, 0.07).normalize();

/* --- where is the sky open, and how high is the ground there? ------------- */
function skyGroundY(x, z) {
  if (x > ST_X0 - 0.30 && x < ST_X1 + 0.30 && z > ST_Z0 - 0.30 && z < ST_Z1 + 0.06) return -1;   // shop
  if (x > ST_X0 - 0.40 && x < ST_X1 + 0.42 && z >= ST_Z1 && z < 0.42) return -1;                 // front canopy
  if (x >= ST_X1 && x < ST_X1 + 1.16 && z > -5.80 && z < ST_Z1) return -1;                       // side canopy
  if (x > -6.45 && x < 2.40 && z < -8.26) return -1;                                             // block behind
  if (x < ALLEY_X0 + 0.02 && z < -0.16) return -1;                                               // west block
  if (x > SWR_X0 + 1.18 && z < SWN_Z0 - 0.08) return -1;                                         // east block
  if (z > SWF_Z1 + 0.22) return -1;                                                              // far facades
  if (Math.abs(x) > HALF - 0.15 || Math.abs(z) > HALF - 0.15) return -1;

  /* carriageways */
  if (z > RDA_Z0 && z < RDA_Z1) return 0.0;
  if (x > RDB_X0 && x < RDB_X1 && z < RDA_Z0) return 0.0;
  /* forecourt */
  if (z > PARK_Z0 - 0.02 && z < PARK_Z1 && x > ST_X0 - 0.40 && x < SWE_X0) return 0.0;
  /* alley */
  if (x > ALLEY_X0 && x < ALLEY_X1 && z < ALLEY_Z1) return ALLEY_Y;
  /* everything else is pavement */
  return CURB_Y;
}

/* ============================================================================
   1.  THE CURTAIN
   ========================================================================== */
var RAIN_N = 3500;
var rainMesh = null;
(function curtain() {
  var base = new T.PlaneGeometry(1, 1);
  var g = new T.InstancedBufferGeometry();
  g.index = base.index;
  g.setAttribute('position', base.attributes.position);
  g.setAttribute('uv', base.attributes.uv);

  RNG = mulberry32(12345);
  var aP = new Float32Array(RAIN_N * 4);   // x, z, topY, fallSpan
  var aQ = new Float32Array(RAIN_N * 4);   // phase, speed, length, width*alpha
  for (var i = 0; i < RAIN_N; i++) {
    var x = rr(-HALF - 1.2, HALF + 1.2);
    var z = rr(-HALF - 1.2, HALF + 1.2);
    var top = rr(7.5, 13.0);
    aP[i * 4] = x; aP[i * 4 + 1] = z; aP[i * 4 + 2] = top; aP[i * 4 + 3] = top + rr(1.0, 3.0);
    aQ[i * 4] = RNG();
    aQ[i * 4 + 1] = rr(0.40, 0.70);
    aQ[i * 4 + 2] = rr(0.20, 0.52);
    aQ[i * 4 + 3] = rr(0.0055, 0.0130);
  }
  g.setAttribute('aP', new T.InstancedBufferAttribute(aP, 4));
  g.setAttribute('aQ', new T.InstancedBufferAttribute(aQ, 4));
  g.instanceCount = RAIN_N;

  var mat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.AdditiveBlending,
    side: T.DoubleSide,
    uniforms: {
      uTime: TIME_UNI,
      uWind: { value: WIND },
      uCold: { value: new T.Color(0x9fc0e8) },
      uLP: WET_UNI.uLP,
      uLC: WET_UNI.uLC,
      uAmt: WET_UNI.uRainAmt
    },
    vertexShader: [
      'attribute vec4 aP; attribute vec4 aQ;',
      'uniform float uTime; uniform vec3 uWind; uniform vec4 uLP[' + WET_NL + '];',
      'uniform vec4 uLC[' + WET_NL + ']; uniform float uAmt;',
      'varying float vA; varying vec3 vLit; varying vec2 vUv;',
      'void main(){',
      '  float t = fract( uTime*aQ.y + aQ.x );',
      '  float drop = aP.z - t*aP.w;',
      '  vec3 wp = vec3( aP.x + uWind.x*(aP.z-drop)*0.55, drop, aP.y + uWind.z*(aP.z-drop)*0.55 );',
      /* billboard: keep the streak along the wind vector, widen across the view */
      '  vec3 camR = vec3( viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0] );',
      '  vec3 dir = normalize(uWind);',
      '  vec3 rgt = normalize( camR - dir*dot(camR,dir) );',
      '  float len = aQ.z * mix(0.55,1.0,uAmt);',
      '  vec3 off = rgt*(uv.x-0.5)*aQ.w + dir*(0.5-uv.y)*len;',
      '  vec4 mv = modelViewMatrix * vec4( wp + off, 1.0 );',
      '  gl_Position = projectionMatrix * mv;',
      '  vUv = uv;',
      /* rain catches whatever light it passes through */
      '  vec3 lit = vec3(0.0);',
      '  for(int i=0;i<' + WET_NL + ';i++){',
      '    vec3 L = uLP[i].xyz - wp;',
      '    float d2 = dot(L,L);',
      '    float r = uLP[i].w*1.9;',
      '    lit += uLC[i].xyz * (r*r/(d2 + r*r));',
      '  }',
      '  vLit = lit;',
      '  vA = smoothstep(0.0,0.05,t) * (1.0 - smoothstep(0.86,1.0,t));',
      '  vA *= step(0.02, drop);',
      '  vA *= mix(0.18, 1.0, smoothstep(46.0, 11.0, -mv.z));',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying float vA; varying vec3 vLit; varying vec2 vUv;',
      'uniform vec3 uCold; uniform float uAmt;',
      'void main(){',
      '  float w = smoothstep(0.5,0.12,abs(vUv.x-0.5));',
      '  float f = smoothstep(0.0,0.30,vUv.y) * smoothstep(1.0,0.62,vUv.y);',
      '  float a = w*f*vA*uAmt;',
      '  vec3 col = uCold*0.55 + vLit*0.62;',
      '  gl_FragColor = vec4( col, a*0.27 );',
      '}'
    ].join('\n')
  });
  rainMesh = new T.Mesh(g, mat);
  rainMesh.frustumCulled = false;
  rainMesh.renderOrder = 9;
  rainMesh.userData.dynamic = true;
  rainGrp.add(rainMesh);
  NO_OUTLINE.push(rainMesh);
})();

/* ============================================================================
   2.  SPLASH CROWNS
   ========================================================================== */
var SPLASH_N = 430;
var splashMesh = null;
(function splashes() {
  var base = new T.PlaneGeometry(1, 1);
  var g = new T.InstancedBufferGeometry();
  g.index = base.index;
  g.setAttribute('position', base.attributes.position);
  g.setAttribute('uv', base.attributes.uv);

  RNG = mulberry32(55501);
  var aP = new Float32Array(SPLASH_N * 4);   // x, y, z, phase
  var aQ = new Float32Array(SPLASH_N * 2);   // rate, size
  var made = 0, guard = 0;
  while (made < SPLASH_N && guard < SPLASH_N * 40) {
    guard++;
    var x = rr(-HALF + 0.3, HALF - 0.3), z = rr(-HALF + 0.3, HALF - 0.3);
    var y = skyGroundY(x, z);
    if (y < 0) continue;
    aP[made * 4] = x; aP[made * 4 + 1] = y; aP[made * 4 + 2] = z; aP[made * 4 + 3] = RNG();
    aQ[made * 2] = rr(0.55, 1.15);
    aQ[made * 2 + 1] = rr(0.040, 0.082);
    made++;
  }
  g.setAttribute('aP', new T.InstancedBufferAttribute(aP, 4));
  g.setAttribute('aQ', new T.InstancedBufferAttribute(aQ, 2));
  g.instanceCount = made;

  var mat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.AdditiveBlending,
    side: T.DoubleSide,
    uniforms: {
      uTime: TIME_UNI, uAmt: WET_UNI.uRainAmt,
      uLP: WET_UNI.uLP, uLC: WET_UNI.uLC,
      uTint: { value: new T.Color(0xbfd8f2) }
    },
    vertexShader: [
      'attribute vec4 aP; attribute vec2 aQ;',
      'uniform float uTime; uniform vec4 uLP[' + WET_NL + ']; uniform vec4 uLC[' + WET_NL + '];',
      'varying vec2 vUv; varying float vA; varying vec3 vLit;',
      'void main(){',
      '  float t = fract( uTime*aQ.x + aP.w );',
      '  float pop = smoothstep(0.0,0.16,t) * (1.0 - smoothstep(0.16,0.62,t));',
      '  float s = aQ.y * (0.4 + t*2.6);',
      '  vec3 wp = vec3(aP.x, aP.y + 0.012, aP.z);',
      '  vec3 camR = vec3( viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0] );',
      '  vec3 camU = vec3( viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1] );',
      '  vec3 off = camR*(uv.x-0.5)*s*1.8 + camU*(uv.y)*s*1.5;',
      '  vec4 mv = modelViewMatrix * vec4( wp + off, 1.0 );',
      '  gl_Position = projectionMatrix * mv;',
      '  vUv = uv;',
      '  vA = pop * mix(0.0, 1.0, smoothstep(30.0, 7.0, -mv.z));',
      '  vec3 lit = vec3(0.0);',
      '  for(int i=0;i<' + WET_NL + ';i++){',
      '    vec3 L = uLP[i].xyz - wp; float d2 = dot(L,L); float r = uLP[i].w*1.7;',
      '    lit += uLC[i].xyz * (r*r/(d2 + r*r));',
      '  }',
      '  vLit = lit;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec2 vUv; varying float vA; varying vec3 vLit;',
      'uniform vec3 uTint; uniform float uAmt;',
      'void main(){',
      /* a little crown: two side flicks and a thin centre spike */
      '  float x = vUv.x-0.5, y = vUv.y;',
      '  float spike = smoothstep(0.10,0.0,abs(x)) * smoothstep(1.0,0.15,y);',
      '  float sideL = smoothstep(0.09,0.0,abs(x+0.30-y*0.16)) * smoothstep(0.85,0.05,y);',
      '  float sideR = smoothstep(0.09,0.0,abs(x-0.30+y*0.16)) * smoothstep(0.85,0.05,y);',
      '  float ring = smoothstep(0.07,0.0,abs(y-0.06)) * smoothstep(0.52,0.30,abs(x));',
      '  float a = (spike*0.9 + (sideL+sideR)*0.55 + ring*0.8) * vA * uAmt;',
      '  vec3 col = uTint*0.55 + vLit*0.42;',
      '  gl_FragColor = vec4( col, a*0.28 );',
      '}'
    ].join('\n')
  });
  splashMesh = new T.Mesh(g, mat);
  splashMesh.frustumCulled = false;
  splashMesh.renderOrder = 9;
  splashMesh.userData.dynamic = true;
  rainGrp.add(splashMesh);
  NO_OUTLINE.push(splashMesh);
})();

/* ============================================================================
   3.  CANOPY DRIPS
   ========================================================================== */
var DRIP_N = 300;
var dripMesh = null;
(function drips() {
  var base = new T.PlaneGeometry(1, 1);
  var g = new T.InstancedBufferGeometry();
  g.index = base.index;
  g.setAttribute('position', base.attributes.position);
  g.setAttribute('uv', base.attributes.uv);

  RNG = mulberry32(77123);
  var aP = new Float32Array(DRIP_N * 4);   // x, yTop, z, phase
  var aQ = new Float32Array(DRIP_N * 3);   // rate, fallSpan, hangFrac
  var made = 0, guard = 0;
  while (made < DRIP_N && guard < DRIP_N * 20 && DRIP_EDGES.length) {
    guard++;
    var E = DRIP_EDGES[ri(0, DRIP_EDGES.length - 1)];
    var t = rr(0, 1);
    var px, pz;
    if (E.axis === 'x') { px = lerp(E.x0, E.x1, t); pz = E.z; }
    else { pz = lerp(E.x0, E.x1, t); px = E.z; }
    var gy = skyGroundY(px, pz + 0.06);
    if (gy < 0) gy = APRON_Y;
    aP[made * 4] = px; aP[made * 4 + 1] = E.y; aP[made * 4 + 2] = pz; aP[made * 4 + 3] = RNG();
    aQ[made * 3] = rr(0.30, 0.70);
    aQ[made * 3 + 1] = E.y - gy;
    aQ[made * 3 + 2] = rr(0.18, 0.42);
    made++;
  }
  g.setAttribute('aP', new T.InstancedBufferAttribute(aP, 4));
  g.setAttribute('aQ', new T.InstancedBufferAttribute(aQ, 3));
  g.instanceCount = made;

  var mat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.AdditiveBlending,
    side: T.DoubleSide,
    uniforms: {
      uTime: TIME_UNI, uAmt: WET_UNI.uRainAmt,
      uLP: WET_UNI.uLP, uLC: WET_UNI.uLC,
      uTint: { value: new T.Color(0xcfe4ff) }
    },
    vertexShader: [
      'attribute vec4 aP; attribute vec3 aQ;',
      'uniform float uTime; uniform vec4 uLP[' + WET_NL + ']; uniform vec4 uLC[' + WET_NL + '];',
      'varying vec2 vUv; varying float vA; varying vec3 vLit; varying float vStretch;',
      'void main(){',
      '  float t = fract( uTime*aQ.x + aP.w );',
      '  float hang = aQ.z;',
      '  float y, stretch, a;',
      '  if( t < hang ){',
      /* the bead swells on the lip before it lets go */
      '    float k = t/hang;',
      '    y = aP.y - 0.010 - k*0.014;',
      '    stretch = 0.5 + k*0.7;',
      '    a = k;',
      '  } else {',
      '    float k = (t-hang)/(1.0-hang);',
      '    y = aP.y - 0.024 - k*k*aQ.y;',
      '    stretch = 1.0 + k*3.4;',
      '    a = 1.0 - smoothstep(0.90,1.0,k);',
      '  }',
      '  vec3 wp = vec3(aP.x, y, aP.z);',
      '  vec3 camR = vec3( viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0] );',
      '  float w = 0.020;',
      '  vec3 off = camR*(uv.x-0.5)*w + vec3(0.0,1.0,0.0)*(uv.y-0.5)*w*stretch*2.4;',
      '  vec4 mv = modelViewMatrix * vec4( wp + off, 1.0 );',
      '  gl_Position = projectionMatrix * mv;',
      '  vUv = uv; vA = a; vStretch = stretch;',
      '  vec3 lit = vec3(0.0);',
      '  for(int i=0;i<' + WET_NL + ';i++){',
      '    vec3 L = uLP[i].xyz - wp; float d2 = dot(L,L); float r = uLP[i].w*1.7;',
      '    lit += uLC[i].xyz * (r*r/(d2 + r*r));',
      '  }',
      '  vLit = lit;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec2 vUv; varying float vA; varying vec3 vLit; varying float vStretch;',
      'uniform vec3 uTint; uniform float uAmt;',
      'void main(){',
      '  vec2 p = vec2( (vUv.x-0.5)*2.0, (vUv.y-0.5)*2.0 );',
      '  float d = length( vec2(p.x, p.y*0.85) );',
      '  float a = smoothstep(1.0,0.15,d) * vA * uAmt;',
      '  vec3 col = uTint*0.5 + vLit*0.9;',
      '  gl_FragColor = vec4( col, a*0.70 );',
      '}'
    ].join('\n')
  });
  dripMesh = new T.Mesh(g, mat);
  dripMesh.frustumCulled = false;
  dripMesh.renderOrder = 9;
  dripMesh.userData.dynamic = true;
  rainGrp.add(dripMesh);
  NO_OUTLINE.push(dripMesh);
})();

/* ============================================================================
   4.  WATER ON THE GLASS
   A thin sheet parked just outside every pane: beading, sliding rivulets and
   a static speckle, all procedural.
   ========================================================================== */
var glassRainMat = new T.ShaderMaterial({
  transparent: true, depthWrite: false, blending: T.AdditiveBlending,
  side: T.DoubleSide,
  uniforms: {
    uTime: TIME_UNI, uAmt: WET_UNI.uRainAmt,
    uTint: { value: new T.Color(0xbcd8f5) },
    uWarm: { value: new T.Color(0xffd9a4) }
  },
  vertexShader: [
    'varying vec2 vUv;',
    'void main(){ vUv = uv;',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }'
  ].join('\n'),
  fragmentShader: [
    'varying vec2 vUv;',
    'uniform float uTime, uAmt; uniform vec3 uTint, uWarm;',
    'float h11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }',
    'float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }',
    'void main(){',
    '  float acc = 0.0;',
    /* sliding rivulets */
    '  for(int i=0;i<3;i++){',
    '    float fi = float(i);',
    '    float cols = 9.0 + fi*7.0;',
    '    float sx = vUv.x*cols;',
    '    float c = floor(sx);',
    '    float hh = h11(c*1.7 + fi*23.1);',
    '    float sp = 0.055 + hh*0.135;',
    '    float yy = fract( vUv.y + uTime*sp + hh*3.3 );',
    '    float xd = abs(fract(sx)-0.5) * 2.0;',
    '    float wob = sin( yy*22.0 + hh*30.0 )*0.10;',
    '    float w = smoothstep(0.55,0.0, abs(xd - 0.5 - wob) );',
    '    float head = smoothstep(0.035,0.0, abs(yy-0.30));',
    '    float trail = smoothstep(0.60,0.30, yy) * smoothstep(0.0,0.10, yy);',
    '    acc += w * (head*1.0 + trail*0.28) * (0.5+hh*0.5);',
    '  }',
    /* static beading */
    '  vec2 bp = vUv*vec2(26.0,34.0);',
    '  vec2 bi = floor(bp), bf = fract(bp)-0.5;',
    '  float bh = h21(bi);',
    '  float bd = length(bf*vec2(1.0,0.86)) ;',
    '  float bead = smoothstep(0.34,0.06, bd) * step(0.55, bh) * (0.35+0.65*bh);',
    /* slow drift downward for the whole beaded film */
    '  vec2 bp2 = vUv*vec2(19.0,25.0) + vec2(0.0, uTime*0.035);',
    '  vec2 bi2 = floor(bp2), bf2 = fract(bp2)-0.5;',
    '  float bh2 = h21(bi2+7.7);',
    '  float bead2 = smoothstep(0.30,0.05, length(bf2)) * step(0.72, bh2);',
    '  float a = (acc*0.42 + bead*0.16 + bead2*0.20) * uAmt;',
    '  float warmK = smoothstep(0.0,0.65,vUv.y);',
    '  vec3 col = mix(uTint, uWarm, 0.42) * (0.55 + acc*0.30);',
    '  gl_FragColor = vec4( col, clamp(a,0.0,1.0)*0.42 );',
    '}'
  ].join('\n')
});

(function glassWater() {
  for (var i = 0; i < GLASS_PANES.length; i++) {
    var G = GLASS_PANES[i];
    if (G.h < 0.5) continue;
    var p = plane(G.w * 0.99, G.h * 0.99, glassRainMat, 0, 0, 0);
    var out = 0.045;
    p.position.set(
      G.x + (G.ry ? out : 0),
      G.y,
      G.z + (G.ry ? 0 : out)
    );
    p.rotation.y = G.ry;
    p.renderOrder = 10;
    p.userData.dynamic = true;
    rainGrp.add(p);
    NO_OUTLINE.push(p);
  }
})();

/* ============================================================================
   5.  GROUND HAZE -- a whisper of spray bouncing off the tarmac
   ========================================================================== */
(function haze() {
  var tex = ctex(128, 64, function (g, w, h) {
    g.clearRect(0, 0, w, h);
    var gr = g.createLinearGradient(0, h, 0, 0);
    gr.addColorStop(0.0, 'rgba(255,255,255,0.55)');
    gr.addColorStop(0.5, 'rgba(255,255,255,0.16)');
    gr.addColorStop(1.0, 'rgba(255,255,255,0.0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    var gr2 = g.createLinearGradient(0, 0, w, 0);
    gr2.addColorStop(0.0, 'rgba(0,0,0,1)');
    gr2.addColorStop(0.25, 'rgba(0,0,0,0)');
    gr2.addColorStop(0.75, 'rgba(0,0,0,0)');
    gr2.addColorStop(1.0, 'rgba(0,0,0,1)');
    g.globalCompositeOperation = 'destination-out';
    g.fillStyle = gr2; g.fillRect(0, 0, w, h);
  });
  var spots = [
    [-2.3, 0.0, 1.6, 5.0, 0xffd9a4, 0.26],
    [3.4, 0.0, 5.4, 5.6, 0xcfe4ff, 0.20],
    [6.2, 0.0, 5.0, 4.6, 0xcfe4ff, 0.16],
    [-7.2, 0.0, -0.4, 3.6, 0xffc9b0, 0.18],
    [2.6, 0.0, -5.2, 3.4, 0xdfeeff, 0.16]
  ];
  for (var i = 0; i < spots.length; i++) {
    var s = spots[i];
    var m = plane(s[3], 0.90, flat(s[4], {
      map: tex, transparent: true, opacity: s[5], blend: 'add', depthWrite: false, uniq: 1
    }), s[0], s[1] + 0.44, s[2]);
    m.userData.billboard = true;
    m.renderOrder = 8;
    m.userData.dynamic = true;
    rainGrp.add(m);
    NO_OUTLINE.push(m);
    BILLBOARDS.push(m);
    GLOWS.push({ m: m.material, base: s[5], amp: s[5] * 0.22, sp: 0.35 + i * 0.13 });
  }
})();
/* ============================================================================
   STATIC BATCHING
   The diorama is authored as a few thousand small meshes.  Everything that
   never moves is merged per material into one BufferGeometry, which collapses
   the draw call count by roughly forty times.
   ========================================================================== */
function mergeItems(items) {
  var i, k, total = 0, prepared = [];
  for (i = 0; i < items.length; i++) {
    var g = items[i].geo;
    if (g.index) g = g.toNonIndexed();
    if (!g.attributes.normal) g.computeVertexNormals();
    prepared.push({ g: g, m: items[i].m, flip: items[i].m.determinant() < 0 });
    total += g.attributes.position.count;
  }
  var pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uvs = new Float32Array(total * 2);
  var off = 0;
  var v = new T.Vector3(), n = new T.Vector3(), nm = new T.Matrix3();
  for (i = 0; i < prepared.length; i++) {
    var G = prepared[i].g, M4 = prepared[i].m, flip = prepared[i].flip;
    nm.getNormalMatrix(M4);
    var Pp = G.attributes.position, N = G.attributes.normal, U = G.attributes.uv;
    var cnt = Pp.count;
    for (k = 0; k < cnt; k++) {
      /* reverse winding when the matrix mirrors */
      var src = flip ? (k - (k % 3)) + (2 - (k % 3)) : k;
      v.fromBufferAttribute(Pp, src).applyMatrix4(M4);
      pos[(off + k) * 3] = v.x; pos[(off + k) * 3 + 1] = v.y; pos[(off + k) * 3 + 2] = v.z;
      if (N) {
        n.fromBufferAttribute(N, src).applyMatrix3(nm).normalize();
        if (flip) n.negate();
        nor[(off + k) * 3] = n.x; nor[(off + k) * 3 + 1] = n.y; nor[(off + k) * 3 + 2] = n.z;
      }
      if (U) { uvs[(off + k) * 2] = U.getX(src); uvs[(off + k) * 2 + 1] = U.getY(src); }
    }
    off += cnt;
  }
  var out = new T.BufferGeometry();
  out.setAttribute('position', new T.BufferAttribute(pos, 3));
  out.setAttribute('normal', new T.BufferAttribute(nor, 3));
  out.setAttribute('uv', new T.BufferAttribute(uvs, 2));
  out.computeBoundingSphere();
  return out;
}

function bakeGroup(root) {
  root.updateMatrixWorld(true);
  var rootInv = new T.Matrix4().copy(root.matrixWorld).invert();
  var buckets = {}, order = [], collected = [];
  var tmp = new T.Matrix4();

  function walk(o) {
    if (o !== root && o.userData.dynamic) return;
    if (o.isMesh && !o.isInstancedMesh && !Array.isArray(o.material) && o.visible &&
      o.geometry && o.geometry.attributes && o.geometry.attributes.position &&
      !o.geometry.isInstancedBufferGeometry) {
      var m = o.material;
      var key = m.uuid + '|' + (o.castShadow ? 1 : 0) + (o.receiveShadow ? 1 : 0) +
        (o.userData._noOut ? 1 : 0) + '|' + o.renderOrder;
      if (!buckets[key]) {
        buckets[key] = {
          mat: m, cast: o.castShadow, recv: o.receiveShadow,
          noOut: !!o.userData._noOut, ro: o.renderOrder, items: []
        };
        order.push(key);
      }
      tmp.multiplyMatrices(rootInv, o.matrixWorld);
      buckets[key].items.push({ geo: o.geometry, m: tmp.clone() });
      collected.push(o);
    }
    for (var i = o.children.length - 1; i >= 0; i--) walk(o.children[i]);
  }
  walk(root);

  for (var c = 0; c < collected.length; c++) {
    var o = collected[c];
    o.userData._baked = true;
    if (o.children.length) { o.visible = false; continue; }
    if (o.parent) o.parent.remove(o);
  }

  var made = [];
  for (var q = 0; q < order.length; q++) {
    var B = buckets[order[q]];
    var geo = mergeItems(B.items);
    var m2 = new T.Mesh(geo, B.mat);
    m2.castShadow = B.cast; m2.receiveShadow = B.recv;
    m2.renderOrder = B.ro;
    m2.userData._noOut = B.noOut;
    root.add(m2);
    made.push(m2);
  }
  return made;
}

/* --- billboards are lifted to the scene root so a single quaternion copy
       orients them, and so the batcher walks around them ------------------- */
(function reparentBillboards() {
  scene.updateMatrixWorld(true);
  var wp = new T.Vector3(), wq = new T.Quaternion(), ws = new T.Vector3();
  for (var i = 0; i < BILLBOARDS.length; i++) {
    var o = BILLBOARDS[i];
    o.updateWorldMatrix(true, false);
    o.matrixWorld.decompose(wp, wq, ws);
    if (o.parent) o.parent.remove(o);
    o.position.copy(wp);
    o.scale.copy(ws);
    o.quaternion.identity();
    o.userData.dynamic = true;
    scene.add(o);
  }
})();

(function bakeScene() {
  scene.updateMatrixWorld(true);
  var i;
  for (i = 0; i < NO_OUTLINE.length; i++) NO_OUTLINE[i].userData._noOut = true;
  for (i = 0; i < DOORS.length; i++) DOORS[i].g.userData.dynamic = true;
  rainGrp.userData.dynamic = true;

  var made = bakeGroup(scene);

  /* each sliding door leaf merges inside its own pivot */
  for (i = 0; i < DOORS.length; i++) {
    DOORS[i].g.userData.dynamic = false;
    made = made.concat(bakeGroup(DOORS[i].g));
    DOORS[i].g.userData.dynamic = true;
  }

  /* rebuild the outline-exclusion list */
  var keep = [];
  for (i = 0; i < NO_OUTLINE.length; i++) {
    if (!NO_OUTLINE[i].userData._baked) keep.push(NO_OUTLINE[i]);
  }
  for (i = 0; i < made.length; i++) if (made[i].userData._noOut) keep.push(made[i]);
  NO_OUTLINE.length = 0;
  for (i = 0; i < keep.length; i++) NO_OUTLINE.push(keep[i]);
})();
/* ============================================================================
   DIRECTOR -- one 26 s loop of small, quiet events
   ========================================================================== */
var CYCLE = 26.0;

function fract(x) { return x - Math.floor(x); }
function hash1(x) { return fract(Math.sin(x * 127.1 + 311.7) * 43758.5453); }

/* --- the shop sign: a tired ballast that stutters now and then ------------ */
function flick(t, seed, rate, badness) {
  var burst = hash1(Math.floor(t * 0.42 + seed) * 1.7 + seed);
  var base = 0.955 + 0.045 * Math.sin(t * 7.3 + seed * 4.1);
  if (burst > badness) {
    var f = hash1(Math.floor(t * (rate || 15) + seed * 3.3));
    if (f > 0.52) return 0.30 + f * 0.34;
    if (f > 0.36) return 0.82;
  }
  return base;
}

/* --- automatic door: opens twice a cycle, unhurried ----------------------- */
var DOOR_EVENTS = [[5.60, 6.45, 9.70, 10.65], [17.30, 18.10, 20.40, 21.45]];
function doorOpen(ct) {
  var v = 0;
  for (var i = 0; i < DOOR_EVENTS.length; i++) {
    var E = DOOR_EVENTS[i];
    if (ct >= E[0] && ct < E[1]) v = Math.max(v, easeIO((ct - E[0]) / (E[1] - E[0])));
    else if (ct >= E[1] && ct < E[2]) v = Math.max(v, 1);
    else if (ct >= E[2] && ct < E[3]) v = Math.max(v, 1 - easeIO((ct - E[2]) / (E[3] - E[2])));
  }
  return v;
}

/* --- traffic signal phase ------------------------------------------------- */
var SIG_ON = [0x5ce89a, 0xffb03a, 0xff5a5a];
var SIG_OFF = [0x1e4436, 0x483619, 0x4a1e22];
function signalPhase(ct) {
  if (ct < 11.5) return 0;          // green
  if (ct < 13.6) return 1;          // amber
  return 2;                         // red
}
function applySignal(store, phase, t, blink) {
  for (var i = 0; i < store.lamps.length; i++) {
    var on = (i === phase);
    store.lamps[i].color.setHex(on ? SIG_ON[i] : SIG_OFF[i]);
    if (store.glow[i]) store.glow[i].opacity = on ? (0.44 + (i === 1 ? 0.10 * Math.sin(t * 9) : 0.04 * Math.sin(t * 2.1))) : 0.0;
  }
  if (store.ped) {
    var walk = (phase === 2);
    var blinkOn = !walk || t % 0.7 < 0.42 || !blink;
    store.ped[0].color.setHex(walk ? 0x4a1e22 : 0xff5a5a);
    store.ped[1].color.setHex(walk && blinkOn ? 0x5ce89a : 0x243c33);
  }
}

/* --- cache the untouched colour of every material we tint ----------------- */
function baseColor(rec) {
  if (!rec.c0) rec.c0 = rec.m.color.clone();
  return rec.c0;
}

var _tmpQ = new T.Quaternion();
var _sunBase = new T.Vector3(-15, 21, 13);

function updateDirector(t, dt) {
  var ct = t % CYCLE;

  /* ---- rain intensity breathes over about a minute ---- */
  var amt = 0.90 + 0.20 * Math.sin(t * 0.083) + 0.07 * Math.sin(t * 0.31 + 1.2);
  amt = clamp(amt, 0.62, 1.18);
  WET_UNI.uRainAmt.value = amt;

  /* ---- automatic door ---- */
  var op = doorOpen(ct);
  for (var d = 0; d < DOORS.length; d++) DOORS[d].g.position.x = DOORS[d].x0 + DOORS[d].dx * op;
  /* light and warmth spill out while it stands open */
  spillL.intensity = 0.80 + op * 0.55;
  WL.shopE.k = 1.90 + op * 0.70;
  WL.shopW.k = 2.10 + op * 0.24;

  /* ---- signage flicker ---- */
  var fMain = flick(t, 1.7, 16, 0.905);
  var fBlade = flick(t, 5.3, 13, 0.945);
  for (var s = 0; s < SIGN_FACES.length; s++) {
    var F = SIGN_FACES[s];
    var k = (F.blade ? fBlade : fMain);
    if (F.halo) F.m.opacity = F.base * k;
    else F.m.color.setScalar(F.base * k);
  }
  WL.sign.k = 2.90 * fMain;
  WL.blade.k = 2.10 * fBlade;

  /* ---- generic glows ---- */
  for (var q = 0; q < GLOWS.length; q++) {
    var G = GLOWS[q];
    var kk = G.base + G.amp * Math.sin(t * G.sp + q * 1.7);
    if (G.m.transparent) G.m.opacity = kk;
    else G.m.color.copy(baseColor(G)).multiplyScalar(kk);
  }

  /* ---- interior fluorescents ---- */
  for (var c = 0; c < CEIL_TUBES.length; c++) {
    var CT = CEIL_TUBES[c];
    if (CT.stut) {
      var fk = flick(t, 9.1 + c, 22, 0.965);
      CT.m.color.setScalar(CT.base * fk);
    }
  }
  for (var cg = 0; cg < COOLER_GLOW.length; cg++) {
    var CG = COOLER_GLOW[cg];
    CG.m.opacity = CG.base + 0.030 * Math.sin(t * CG.sp + cg);
  }

  /* ---- vending machines ---- */
  for (var v = 0; v < VEND_GLOW.length; v++) {
    var V = VEND_GLOW[v];
    var vk = 0.96 + 0.045 * Math.sin(t * V.sp + v * 2.3);
    if (v === 2) vk *= flick(t, 21.3, 19, 0.972);        // the tired one in the alley
    V.m.color.setScalar(vk);
  }
  WL.vendW.k = 2.40 * (0.95 + 0.06 * Math.sin(t * 0.9));

  /* ---- street lamps ---- */
  for (var L = 0; L < LAMP_HALOS.length; L++) {
    var LH = LAMP_HALOS[L];
    LH.m.opacity = LH.base * (0.94 + 0.06 * Math.sin(t * LH.sp + L * 1.3));
  }

  /* ---- traffic signals ---- */
  var ph = signalPhase(ct);
  applySignal(TRAFFIC, ph, t, true);
  applySignal(TRAFFIC2, signalPhase((ct + 12.5) % CYCLE), t, false);
  WL.signal.c.setHex(SIG_ON[ph]);
  WL.signal.k = ph === 1 ? 3.6 : 3.0;

  /* ---- push the registry to the shader ---- */
  syncAllWetLights();

  /* ---- billboards face the viewer ---- */
  _tmpQ.copy(camera.quaternion);
  for (var b = 0; b < BILLBOARDS.length; b++) BILLBOARDS[b].quaternion.copy(_tmpQ);

  /* ---- a very slow drift in the moonlight ---- */
  sun.position.set(
    _sunBase.x + Math.sin(t * 0.041) * 1.5,
    _sunBase.y,
    _sunBase.z + Math.cos(t * 0.034) * 1.3
  );
}

/* ============================================================================
   MAIN LOOP
   ========================================================================== */
Ctl.sph.phi = 0.760;
Ctl.sph.theta = 1.330;
Ctl.sphT.phi = 1.238;
Ctl.sphT.theta = 0.530;
Ctl.target.set(-0.60, 1.45, -1.10);

var _last = 0, _started = false;
function frame(nowMs) {
  requestAnimationFrame(frame);
  /* self-healing viewport: covers layout that was not ready on the resize event */
  if (!rtColor || canvas.clientWidth !== _lastW || canvas.clientHeight !== _lastH) {
    if (!resize() || !rtColor) return;
  }
  var now = nowMs * 0.001;
  if (!_last) _last = now;
  var dt = Math.min(0.05, Math.max(0.0005, now - _last));
  _last = now;
  var t = (TIME_UNI.value += dt);
  updateDirector(t, dt);
  Ctl.update(dt);
  WET_UNI.uCamP.value.copy(camera.position);
  renderFrame();
  if (!_started) { _started = true; document.body.classList.add('ready'); }
}

resize();
TIME_UNI.value = 0.0;
requestAnimationFrame(frame);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
document.addEventListener('visibilitychange', function () { _last = 0; });

</script>
</body>
</html>
